name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Schnell aufeinanderfolgende Pushes auf denselben PR-Branch: den alten Lauf
# abbrechen statt beide zu Ende laufen zu lassen. Auf `main` NICHT abbrechen —
# dort soll jeder gemergte Stand nachweislich getestet sein.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --fund=false

      # Der Chromium-Download war mit Abstand der teuerste Schritt (~20 s von
      # ~40 s Gesamtlaufzeit). Der Browser hängt nur an der Playwright-Version,
      # deshalb Cache-Key auf package-lock.json — bei unverändertem Lockfile
      # entfällt Download UND apt-get komplett.
      - name: Playwright-Browser aus dem Cache holen
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - run: npm test
